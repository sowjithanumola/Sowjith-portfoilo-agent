<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Agent</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: #030305;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* =========================
   VOICE ORB
========================= */

.orb {
    width: 230px;
    height: 230px;
    border-radius: 50%;
    cursor: pointer;
    position: relative;

    background:
        radial-gradient(
            circle at 30% 24%,
            #ffffff 0%,
            #c9f8ff 6%,
            #65e5ff 18%,
            #5b63ff 42%,
            #9c3cff 68%,
            #ff3c9d 100%
        );

    box-shadow:
        0 0 25px rgba(80, 220, 255, .45),
        0 0 65px rgba(100, 75, 255, .45),
        0 0 120px rgba(255, 50, 160, .2),
        inset -25px -30px 50px rgba(20, 0, 80, .35),
        inset 15px 15px 35px rgba(255,255,255,.22);

    animation:
        float 4s ease-in-out infinite,
        breathe 3s ease-in-out infinite;

    transition:
        transform .35s ease,
        filter .35s ease;
}

/* Inner glow */

.orb::before {
    content: "";
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    border: 1px solid rgba(120,220,255,.22);
    animation: wave 3s ease-out infinite;
}

/* Outer glow */

.orb::after {
    content: "";
    position: absolute;
    inset: -40px;
    border-radius: 50%;
    border: 1px solid rgba(170,100,255,.12);
    animation: wave 3s ease-out infinite 1.3s;
}

/* Hover */

.orb:hover {
    transform: scale(1.06);
    filter: brightness(1.12);
}

/* Listening */

.orb.listening {
    animation:
        float 4s ease-in-out infinite,
        listen .75s ease-in-out infinite;
}

.orb.listening::before {
    animation-duration: 1s;
}

.orb.listening::after {
    animation-duration: 1.3s;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes float {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}

@keyframes breathe {

    0%,
    100% {
        box-shadow:
            0 0 25px rgba(80,220,255,.45),
            0 0 65px rgba(100,75,255,.45),
            0 0 120px rgba(255,50,160,.2),
            inset -25px -30px 50px rgba(20,0,80,.35),
            inset 15px 15px 35px rgba(255,255,255,.22);
    }

    50% {
        box-shadow:
            0 0 45px rgba(80,220,255,.7),
            0 0 100px rgba(100,75,255,.6),
            0 0 160px rgba(255,50,160,.3),
            inset -25px -30px 50px rgba(20,0,80,.35),
            inset 15px 15px 35px rgba(255,255,255,.22);
    }
}

@keyframes listen {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}

@keyframes wave {

    0% {
        transform: scale(.85);
        opacity: .7;
    }

    100% {
        transform: scale(1.22);
        opacity: 0;
    }
}

/* Mobile */

@media(max-width:600px) {

    .orb {
        width: 170px;
        height: 170px;
    }

}
</style>
</head>

<body>

<div
    class="orb"
    id="orb"
    role="button"
    tabindex="0"
    aria-label="Voice Agent">
</div>

<script>

/* ==========================================
   VOICE AGENT
========================================== */

const orb = document.getElementById("orb");

let listening = false;

/*
   Click the orb to activate/deactivate
*/

orb.addEventListener("click", async () => {

    listening = !listening;

    if (listening) {

        orb.classList.add("listening");

        /*
          Connects to Lyzr voice session API
          
          POST https://voice-livekit.studio.lyzr.ai/v1/sessions/start
          
          With Agent ID:
          6a9d6b09b4c51e185bbbc192
        */

        try {

            const response = await fetch(
                "/api/voice-session",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        agentId:
                            "6a9d6b09b4c51e185bbbc192",

                        userIdentity:
                            "student-user",

                        roomName:
                            "subject-portfolio-voice"

                    })
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Voice session failed"
                );
            }

            const data =
                await response.json();

            console.log(
                "Voice session:",
                data
            );

        } catch (error) {

            console.error(error);

            listening = false;

            orb.classList.remove(
                "listening"
            );
        }

    } else {

        orb.classList.remove(
            "listening"
        );

    }

});


/* Keyboard support */

orb.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            orb.click();

        }

    }
);

</script>

</body>
</html>
